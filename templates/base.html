<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GS Hackathon Dashboard{% endblock %}</title>
  <!-- Tailwind CSS z CDN - zero node/npm, działa natychmiast -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gs: {
              blue: '#1b365d',
              gold: '#cba052',
              dark: '#0f172a',
              card: '#1e293b'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Navbar -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="w-8 h-8 rounded-lg bg-amber-500 flex items-center justify-center font-black text-slate-950">GS</span>
        <a href="/" class="text-lg font-bold tracking-tight text-white hover:text-amber-400">Hackathon Core</a>
        <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded font-mono">18h Edition</span>
      </div>
      <div class="flex items-center space-x-4 text-sm">
        <a href="/docs" target="_blank" class="text-slate-400 hover:text-white transition">Swagger API (/docs)</a>
        <a href="/api/stats" target="_blank" class="text-slate-400 hover:text-white transition">Raw JSON (/api/stats)</a>
      </div>
    </div>
  </header>

  <!-- Główna zawartość -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Stopka -->
  <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
    Goldman Sachs Hackathon Team Project • FastAPI + Jinja2 + Tailwind CDN
  </footer>

</body>
</html>
